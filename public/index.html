<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with AI - PAW Week 10</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white w-full max-w-2xl rounded-lg shadow-lg flex flex-col h-[600px] border">
    
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg">CS Bot AI Assistant</h1>
        <p class="text-xs text-blue-100">PAW Week 10 - Chat History</p>
      </div>
      <button onclick="loadHistory()" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded transition">
        🔄 Muat Riwayat
      </button>
    </div>

    <!-- Panel Pengaturan (Consent Checkbox & User ID) -->
    <div class="bg-gray-50 border-b p-3 flex items-center justify-between text-sm">
      <div class="flex items-center space-x-2">
        <label class="font-semibold text-gray-700">User ID:</label>
        <input type="number" id="userId" value="1" class="w-16 border rounded px-2 py-1 text-center" />
      </div>

      <div class="flex items-center space-x-2">
        <input type="checkbox" id="saveHistory" checked class="w-4 h-4 text-blue-600 rounded cursor-pointer" />
        <label for="saveHistory" class="text-gray-700 text-xs sm:text-sm font-medium cursor-pointer">
          Simpan Riwayat Percakapan
        </label>
      </div>
    </div>

    <!-- Area Chat Bubbles -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
      <div class="text-center text-gray-400 text-xs my-2">
        Awal percakapan dimulai
      </div>
    </div>

    <!-- Input Box -->
    <div class="p-3 border-t bg-white flex items-center space-x-2">
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Ketik pesan Anda di sini..." 
        class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      />
      <button 
        onclick="sendMessage()" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition"
      >
        Kirim
      </button>
    </div>

  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/chat';

    // Function Kirim Pesan
    async function sendMessage() {
      const userId = document.getElementById('userId').value;
      const messageInput = document.getElementById('messageInput');
      const saveHistory = document.getElementById('saveHistory').checked;
      const message = messageInput.value.trim();

      if (!message) return;

      // Render Bubble Pesan User
      appendBubble('user', message);
      messageInput.value = '';

      try {
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: Number(userId),
            message: message,
            saveHistory: saveHistory
          })
        });

        const result = await response.json();

        if (result.success) {
          appendBubble('model', result.data.reply);
        } else {
          appendBubble('system', 'Error: ' + result.message);
        }
      } catch (err) {
        appendBubble('system', 'Gagal terhubung ke server');
      }
    }

    // Function Load History dari Database
    async function loadHistory() {
      const userId = document.getElementById('userId').value;
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      try {
        const response = await fetch(`${API_BASE}/history/${userId}`);
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          result.data.forEach(item => {
            appendBubble(item.role, item.message);
          });
        } else {
          chatBox.innerHTML = '<div class="text-center text-gray-400 text-xs my-2">Belum ada riwayat tersimpan</div>';
        }
      } catch (err) {
        chatBox.innerHTML = '<div class="text-center text-red-400 text-xs my-2">Gagal memuat riwayat</div>';
      }
    }

    // Helper untuk append bubble chat ke layar
    function appendBubble(role, text) {
      const chatBox = document.getElementById('chatBox');
      const wrapper = document.createElement('div');
      wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      if (role === 'system') {
        wrapper.className = 'flex justify-center';
        wrapper.innerHTML = `<div class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded">${text}</div>`;
      } else {
        const bg = role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 border rounded-bl-none shadow-sm';
        wrapper.innerHTML = `
          <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${bg}">
            <p class="font-bold text-[10px] ${role === 'user' ? 'text-blue-100' : 'text-gray-400'} mb-1">
              ${role === 'user' ? 'Kamu' : 'AI Assistant'}
            </p>
            <p class="whitespace-pre-line">${text}</p>
          </div>
        `;
      }

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
